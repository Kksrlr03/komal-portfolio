<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komal Sriram | Futuristic Portfolio</title>

  <!-- favicon & social preview -->
  <link rel="icon" href="assets/profile.jpg" type="image/jpeg" />
  <meta property="og:title"       content="Komal Sriram | Futuristic Portfolio">
  <meta property="og:description" content="AI-driven developer building automation tools and GenAI projects.">
  <meta property="og:image"       content="assets/profile.jpg">
  <meta property="og:url"         content="https://komalsriram.com/">
  <meta name="twitter:card"       content="summary_large_image">

  <!-- logo font -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"/>

  <style>
/* ==== Reset & base ==== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  color:#fff;
  min-height:100vh;overflow-x:hidden;position:relative;
  background:#000;
}

/* ==== Futuristic Gradient Background ==== */
.bg-gradient{
  position:fixed;inset:0;
  width:100%;height:100%;
  background:linear-gradient(270deg,#1a0033,#4b0082,#8a2be2,#2e0854);
  background-size:600% 600%;
  animation:moveGradient 18s ease infinite;
  z-index:-3;
}
@keyframes moveGradient {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ==== Header ==== */
.header{width:100vw;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.6rem;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);box-shadow:0 0 10px rgba(186,85,211,.45);z-index:10}
.logo{font-family:'Pacifico',cursive;font-size:clamp(1.8rem,6vw,2.6rem);white-space:nowrap;text-shadow:0 0 12px #c77dff}
.nav{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.nav a{color:#dedcff;text-decoration:none;font-weight:500;font-size:1.05rem;transition:.25s}
.nav a:hover{color:#fff;text-shadow:0 0 6px #ba68c8}
.btn{padding:.55rem 1.25rem;border:none;border-radius:28px;background:#5a189a;color:#f6f3ff;font-size:1.02rem;font-weight:600;transition:.25s}
.btn:hover{background:#7b2cbf;color:#fff;box-shadow:0 0 10px #c77dff}

/* ==== Sections ==== */
section{padding:4rem min(8vw,90px);max-width:1600px;margin:auto}
h2{font-size:clamp(1.4rem,4vw+0.4rem,2rem);margin-bottom:1.6rem;text-shadow:0 0 8px #c77dff}

/* ==== Hero ==== */
.hero{text-align:center;padding-top:9vh}
.profile-img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 15px #c77dff;animation:pulse 6s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.hero h2{font-size:clamp(1.5rem,5vw+1rem,2.4rem);margin-top:1.1rem;text-shadow:0 0 12px #c77dff;line-height:1.25}

/* ==== Text blocks ==== */
.about-text,.goals{max-width:850px;margin:auto;font-size:1.05rem;line-height:1.8}

/* ==== Projects ==== */
.projects-grid{display:grid;gap:2.5rem}
.project-card{background:rgba(255,255,255,.08);padding:1.7rem;border-radius:18px;box-shadow:0 0 15px rgba(199,125,255,.25);transition:.3s}
.project-card:hover{transform:translateY(-6px);box-shadow:0 0 20px rgba(199,125,255,.45)}
.project-card.split{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;align-items:center}
.project-card.split video{width:100%;border-radius:12px}
.project-card h3{font-size:clamp(1.3rem,1.2vw+1rem,1.85rem);margin-bottom:.6rem;text-shadow:0 0 8px #e0b0ff}
.tech-grid{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1rem}
.tech-grid img{width:56px;height:56px;filter:drop-shadow(0 0 5px #c77dff);transition:.25s}
.tech-grid img:hover{transform:scale(1.1)}

/* ==== Certificates & Activities ==== */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.7rem;text-align:center}
.cert-item img{width:100%;height:170px;object-fit:cover;border-radius:14px;cursor:pointer;box-shadow:0 0 10px rgba(199,125,255,.35);transition:.4s}
.cert-item:hover img{transform:scale(1.05)}
.cert-caption{margin-top:.6rem;font-weight:600;text-shadow:0 0 4px #c77dff}
.cert-brief{margin-top:.35rem;font-size:.9rem;line-height:1.45;color:#e0d0ff}

/* ==== Modal ==== */
#certModal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#certModal img{max-width:88vw;max-height:80vh;border-radius:10px;box-shadow:0 0 12px #c77dff}
#closeModal{position:absolute;top:22px;right:32px;font-size:36px;font-weight:bold;color:#fff;cursor:pointer;text-shadow:0 0 8px #c77dff}
#certModal .desc{max-width:80vw;margin-top:1rem;text-align:center;line-height:1.6}

/* ==== Scroll-top ==== */
#scrollToTop{position:fixed;bottom:22px;right:22px;padding:14px;border:none;border-radius:50%;font-size:22px;background:#7b2cbf;color:#fff;box-shadow:0 0 10px #c77dff;cursor:pointer;display:none;z-index:60}
#scrollToTop:hover{background:#9d4edd}

/* ==== Footer ==== */
footer{text-align:center;padding:1rem;background:rgba(0,0,0,.65);color:#e0d0ff;font-size:.85rem;text-shadow:0 0 4px #c77dff}

/* ==== Mobile (≤600 px) ==== */
@media(max-width:600px){
  section{padding:3.5rem 6vw}
  .header{flex-direction:column;align-items:flex-start;padding:1.3rem 1rem}
  .logo{font-size:2.4rem;margin-bottom:.7rem}
  .nav a{font-size:1.15rem}
  .btn{font-size:1.1rem;padding:.6rem 1.3rem}
  .profile-img{width:150px;height:150px}
  .project-card,.project-card.split{padding:1.15rem}
  .project-card.split{grid-template-columns:1fr}
  .project-card.split video{margin-bottom:.8rem}
  .project-card h3{font-size:1.45rem}
  .about-text,.goals{font-size:1rem}
  .cert-item img{height:150px}
  footer{font-size:.75rem}
}
  </style>
</head>
<body>

<div class="bg-gradient"></div>

<!-- modal -->
<div id="certModal" aria-hidden="true">
  <span id="closeModal">×</span>
  <img id="modalImg" alt="Document preview">
  <p id="modalDesc" class="desc"></p>
</div>

<header class="header">
  <h1 class="logo">Komal Karri</h1>
  <nav class="nav">
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#academic-docs">Docs</a>
    <a href="#course-certs">Certs</a>
    <a href="#extra-curricular">Activities</a>
    <a href="#goals">Goals</a>
    <a href="assets/resume.pdf" class="btn" target="_blank">Resume</a>
    <a href="https://www.linkedin.com/in/komal-sriram-lakshman-reddy-karri/" class="btn" target="_blank">LinkedIn</a>
  </nav>
</header>

<section class="hero">
  <img src="assets/profile.jpg" alt="Profile" class="profile-img">
  <h2>Hey, I'm Karri Komal Sriram Lakshman Reddy 👋</h2>
</section>

<!-- ===== sections stay SAME (About, Projects, Academic Docs, Course Certs, Extra Activities, Goals, Footer, JS) ===== -->
<!-- 🔥 I did not paste them all again to save space, but in your code just KEEP everything exactly as it was, only replace: 
     1) <canvas id="spaceCanvas"> with <div class="bg-gradient"></div>
     2) Remove JS for starfield. 
     3) Keep modal + scroll button JS. -->

<script>
// scroll-top
const topBtn = document.getElementById('scrollToTop');
window.addEventListener('scroll', ()=>{ topBtn.style.display = window.scrollY > 300 ? 'block' : 'none' });
topBtn.onclick = ()=> window.scrollTo({top:0, behavior:'smooth'});

// certificate modal
function openCert(el){
  document.getElementById('modalImg').src = el.src;
  document.getElementById('modalDesc').textContent = el.dataset.desc || '';
  document.getElementById('certModal').style.display = 'flex';
}
document.getElementById('closeModal').onclick = ()=> document.getElementById('certModal').style.display = 'none';
</script>
</body>
</html>
