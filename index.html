<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | Komal Sriram</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#000;color:#00ff00;font-family:"Courier New",monospace;
      height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden
    }
    video.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;filter:brightness(.35)}
    #terminal{
      background:rgba(0,0,0,.9);border:2px solid #0f0;border-radius:8px;
      box-shadow:0 0 18px #0f0;padding:2rem;width:90%;max-width:600px;
      font-size:1.1rem;white-space:pre-wrap;line-height:1.6
    }
  </style>
</head>
<body>

  <video autoplay muted class="bg" playsinline preload="auto" poster="assets/matrix_intro_poster.jpg">
    <source src="assets/matrix_intro.mp4" type="video/mp4">
  </video>

  <div id="terminal"></div>

  <script>
    const lines = [
      "Initializing komalsriram.com...",
      "Verifying GenAI integrity...",
      "Access granted ✔",
      "Welcome to Komal Sriram's portfolio.",
      "Crafted with code, powered by purpose."
    ];
    let li = 0, ci = 0;
    const term = document.getElementById("terminal");

    function type(){
      if (li < lines.length) {
        if (ci < lines[li].length) {
          term.textContent += lines[li][ci++];
          setTimeout(type, 25);
        } else {
          term.textContent += "\n";
          li++; ci = 0;
          setTimeout(type, 300);
        }
      } else {
        setTimeout(() => location.href = "main.html", 500);
      }
    }
    type();
  </script>
</body>
</html>
