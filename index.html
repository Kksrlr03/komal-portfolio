<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome | Komal Sriram</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:'Orbitron',sans-serif;background:#120014;overflow:hidden
    }

    #vanta-bg{position:fixed;inset:0;z-index:-1;}

    #terminal {
      width:min(850px,92%);padding:2rem;
      background:rgba(10,0,20,0.7);
      border:1px solid rgba(200,140,255,0.2);
      border-radius:12px;
      color:#f0f0ff;text-shadow:0 0 10px rgba(180,120,255,0.3);
      font-size:1rem;line-height:1.6;
      opacity:0;transform:translateY(20px);
      transition:opacity .6s ease,transform .6s ease;
      box-shadow:0 12px 30px rgba(120,0,200,0.25);
    }
    #terminal.visible{opacity:1;transform:translateY(0)}
    pre{font-family:"Courier New",monospace;margin:0;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  <div id="terminal">
    <pre id="typed"></pre>
  </div>

  <!-- three.js + vanta -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    VANTA.NET({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.0,
      scaleMobile: 1.0,
      color: 0xbf40ff,          // soft neon purple
      backgroundColor: 0x120014,
      points: 12.00,            // keep clean, not too many
      maxDistance: 20.00,       // balanced spacing
      spacing: 17.00,           // less dense
      showDots: true
    });
  </script>

  <script>
    const lines = [
  "Starting profile...",
  "Loading details and credentials...",
  "Preparing a closer look...",
  "Ready.",
];

    const typed = document.getElementById('typed');
    const terminal = document.getElementById('terminal');

    setTimeout(()=> terminal.classList.add('visible'),200);

    let li=0,ci=0;
    function type(){
      if(li<lines.length){
        if(ci<lines[li].length){
          typed.textContent+=lines[li][ci++];
          setTimeout(type,30);
        } else {
          typed.textContent+="\n";
          li++;ci=0;
          setTimeout(type,300);
        }
      } else {
        setTimeout(()=>location.href="main.html",1000);
      }
    }
    setTimeout(type,500);
  </script>
</body>
</html>
